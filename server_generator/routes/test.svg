<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Night Sky Background -->
  <rect width="100%" height="100%" fill="#0b0c2a"/>

  <!-- Twinkling Stars -->
  <circle cx="50" cy="40" r="2" fill="#fff" opacity="1">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="80" r="1.5" fill="#ffe" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="30" r="1" fill="#fff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="50" r="2" fill="#ffd" opacity="1">
    <animate attributeName="opacity" values="1;0.5;1" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Moon -->
  <circle cx="160" cy="40" r="10" fill="#ddd" opacity="0.8">
    <animate attributeName="cx" values="160;165;160" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="40;42;40" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Falling Leaves -->
  <g fill="#a0522d" stroke="#6b4226" stroke-width="0.5" opacity="0.9">
    <!-- Leaf 1 -->
    <circle cx="50" cy="20" r="3">
      <animate attributeName="cx" values="50;60;50" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="20;180;20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Leaf 2 -->
    <circle cx="120" cy="10" r="2.5">
      <animate attributeName="cx" values="120;110;120" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="10;190;10" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite" />
    </circle>
    <!-- Leaf 3 -->
    <circle cx="80" cy="30" r="2" fill="#8b4513">
      <animate attributeName="cx" values="80;85;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="30;170;30" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>